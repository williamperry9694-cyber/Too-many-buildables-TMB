[mod-name]
too-many-buildables=Too Many Buildables - (TMB)

[mod-description]
too-many-buildables=A collapsible panel that drops down exactly over your quickbar and shows every buildable in your inventory, sorted into the crafting menu's categories. Made for big mod lists.

[mod-setting-name]
tmb-rows=Quickbar rows
tmb-width=Quickbar width
tmb-offset-x=Fine-tune: horizontal offset (px)
tmb-offset-y=Fine-tune: vertical offset (px)
tmb-mat-width=Materials panel width (slots)
tmb-mat-position=Materials panel position
tmb-tab-position=Category tab position
tmb-slot-layout=Slot layout
tmb-sort=Buildables sort order
tmb-mat-sort=Materials sort order
tmb-mat-offset-x=Materials panel fine-tune: horizontal offset (px)
tmb-mat-offset-y=Materials panel fine-tune: vertical offset (px)

[mod-setting-description]
tmb-tab-position=Where the category tabs sit. Quality buttons stay on the left.
tmb-slot-layout=How a category tab arranges its items.\n[font=default-semibold]Rows[/font]: each subgroup starts its own row.\n[font=default-semibold]Compact[/font]: subgroups follow one another, one empty slot apart.\n[font=default-semibold]Columns[/font]: each subgroup fills top to bottom, then the next column.\n[font=default-semibold]Dense[/font]: no gaps at all.\nThe "All" tab is always packed.
tmb-sort=[font=default-semibold]Crafting order[/font]: the crafting menu's order.\n[font=default-semibold]By type[/font]: same kinds of building together (all inserters, all belts…), crafting order inside each.
tmb-mat-sort=[font=default-semibold]Crafting order[/font]: the crafting menu's order.\n[font=default-semibold]By type[/font]: same kinds of item together (plates, gears, circuits…), crafting order inside each. The Custom section always keeps your own order.
tmb-rows=Set this to match Settings → Interface → Active quickbars, so the panel covers your quickbar exactly. (The game doesn't let mods read this one.)
tmb-width=Set this to match Settings → Interface → Quickbar width. "Auto" reads it from the game.
tmb-offset-x=Nudge the panel and its tab left (negative) or right (positive) in screen pixels.
tmb-offset-y=Nudge the panel and its tab up (negative) or down (positive) in screen pixels.
tmb-mat-width=How many slots wide the Materials side panel and its Track menu are.
tmb-mat-position=Where the Materials panel sits and which way it grows when sections open.\n[font=default-semibold]Above equipment panel[/font]: left edge, resting on the armour/weapons panel, grows upward.\n[font=default-semibold]Left edge, centred[/font]: grows up and down.\n[font=default-semibold]Below GUI Unifier[/font]: under the mod button bar, grows downward (only with GUI Unifier installed).\n[font=default-semibold]Free placement[/font]: unlock to drag it anywhere, then lock.
tmb-mat-offset-x=Nudge the Materials panel left (negative) or right (positive) in screen pixels. Not used in free placement.
tmb-mat-offset-y=Nudge the Materials panel up (negative) or down (positive) in screen pixels. Not used in free placement.

