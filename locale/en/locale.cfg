[controls]
tmb-toggle=Toggle Too Many Buildables
tmb-toggle-materials=Toggle Materials panel
tmb-how-many=How many? (craft an amount)

[controls-description]
tmb-how-many=Over an item or recipe (TMB panels, the crafting menu, or your inventory when no chest or machine is open): opens a box to pick how many to hand-craft.
tmb-toggle=Open or close the buildables panel. Unassigned by default; the ▾ tab above the quickbar does the same.
tmb-toggle-materials=Open or close the Materials side panel. Unassigned by default; the Materials tab (where the panel sits) does the same.

