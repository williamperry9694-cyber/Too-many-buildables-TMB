[item-name]
tmb-casper-tool=Casper
tmb-exorcist=Exorcist
tmb-ritual-tool=Ritual

[item-description]
tmb-exorcist=Click a ghost or building to pick its type, shift-click to un-pick.\nShift-drag to pick every type in the box.\nDrag to remove tracked ghosts of the picked types.\nPicks clear when you put the tool away.
tmb-casper-tool=Drag over an area to track its unbuilt ghosts. Works on the map too.\nShift-drag to add to the current job.\nAlt-click to cancel the current job.
tmb-ritual-tool=Drag over an area to track its upgrade orders until the robots finish them.\nShift-drag to add to the area. Alt-click to cancel the current job.

[shortcut-name]
tmb-casper-give-tool=Casper
tmb-casper-give-exorcist=Exorcist
tmb-casper-give-ritual=Ritual
tmb-casper-auto-track=Casper auto-track

[shortcut-description]
tmb-casper-auto-track=When enabled, automatically tracks pasted Blueprints.

[controls]
tmb-casper-give-tool=Casper: get tool
tmb-casper-cancel-job=Casper / Ritual: cancel job (tool in hand)
tmb-casper-give-exorcist=Casper: get Exorcist
tmb-casper-give-ritual=Ritual: get tool
tmb-casper-auto-track=Casper: toggle auto-track

[controls-description]
tmb-casper-cancel-job=While holding Casper or Ritual, cancels that tool's current job.
tmb-casper-auto-track=When enabled, automatically tracks pasted Blueprints.

