[item-name]
tmb-reaper=Reaper

[item-description]
tmb-reaper=Drag over an area to count what's already marked for deconstruction there, by type. Only what a radar can see is counted.\nShift-drag to add another box. Alt-click to clear the bar.\nReaper never marks or cancels anything, and it counts once: a count only drops as those things are removed.

[shortcut-name]
tmb-reaper-give=Reaper

[controls]
tmb-reaper-give=Reaper: get tool
tmb-reaper-clear=Reaper: clear bar (tool in hand)

[controls-description]
tmb-reaper-clear=While holding Reaper, clears its bar.

[tmb-reaper]
title=Marked for deconstruction
tracking=Found __1__ marked for deconstruction
added=Added __1__ (__2__ counted)
none=Nothing marked for deconstruction here
none-new=Nothing new marked here
out-of-range=Nothing here is in radar range
skipped=__1__ outside radar range left out
cleared=Reaper cleared
item-tooltip=__1__ × __2__
item-tooltip-quality=__1__ (__2__) × __3__
hunted=[color=1,0.85,0.2]Hunted[/color]
guide-hint=[font=default-semibold]Hover[/font] to point to the nearest one, [font=default-semibold]click[/font] to keep pointing
hunt-hint=[font=default-semibold]Right-click[/font] to hunt: add every marked one in radar range on this surface
stop-hint=[font=default-semibold]Shift + right-click[/font] to stop hunting (drops what the hunt added)
fold-hint=[font=default-semibold]Click[/font] to hide or show the list
clear-hint=[font=default-semibold]Alt-click[/font] with Reaper in hand to clear
hunt-found=Hunt: found __1__ more
hunt-none=Hunt: nothing more in radar range
hunt-stopped=Hunt stopped
